[project]
name = "focus"
version = "0.1.0"
description = "The most important thing to work on now and its first small steps"
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "pydantic>=2.0"]

[project.scripts]
focus = "focus.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/focus"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
