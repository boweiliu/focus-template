[program:focus]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/focus && uv sync --locked --project system/apps/focus && python3 system/scripts/forward_port.py --manifest system/apps/focus/app.toml --url http://localhost:8123 && exec env FOCUS_PORT=8123 system/apps/focus/.venv/bin/focus"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/focus-stdout.log
stderr_logfile=/var/log/supervisor/focus-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
